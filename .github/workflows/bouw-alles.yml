name: Bouw alles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Aanpassingen uitpakken
        run: |
          echo "" | base64 -d | tar xJ -C /tmp
          python3 /tmp/extra/patch_video.py launcher/app/src/main/java/com/gathin/tvhome
          python3 /tmp/extra/patch_extra.py launcher/app/src/main /tmp/extra/WeatherPill.java
          cp -r addons/weather addons/lampen
          rm -rf addons/lampen/app addons/lampen/README.md
          cp -r /tmp/extra/lampen/app addons/lampen/app
          sed -i 's/rootProject.name = "weather"/rootProject.name = "lampen"/' addons/lampen/settings.gradle
          git clone -q https://github.com/nayuki/QR-Code-generator /tmp/qr
          git -C /tmp/qr checkout -q bcfe1b018cec5f1f91b5705eca5bb4cdd34e9f8d
          mkdir -p addons/lampen/app/src/main/java/io/nayuki/qrcodegen
          cp /tmp/qr/java/src/main/java/io/nayuki/qrcodegen/{QrCode,QrSegment,BitBuffer,DataTooLongException}.java addons/lampen/app/src/main/java/io/nayuki/qrcodegen/
      - name: Launcher bouwen
        working-directory: launcher
        run: |
          for i in 1 2 3; do chmod +x gradlew && ./gradlew --no-daemon assembleRelease && break; echo "opnieuw proberen"; sleep 15; done
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Lampen-apps bouwen
        working-directory: addons/lampen
        run: |
          for i in 1 2 3; do chmod +x gradlew && ./gradlew --no-daemon assembleRelease && break; echo "opnieuw proberen"; sleep 15; done
          find app/build/outputs/apk -name "*.apk"
      - name: APK's verzamelen
        run: |
          mkdir out
          cp launcher/app/build/outputs/apk/release/app-release.apk out/launcher.apk
          for f in lampen film uit wifi; do cp addons/lampen/app/build/outputs/apk/$f/release/app-$f-release.apk out/$f.apk; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: alles
          path: out/
