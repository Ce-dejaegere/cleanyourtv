name: Bouw Lampen-app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Lampen-project klaarzetten
        run: |
          cp -r addons/weather addons/lampen
          rm -rf addons/lampen/app/src addons/lampen/README.md
          echo "" | base64 -d | tar xz -C addons/lampen
          sed -i "s/io.github.sumyabazar1.weather/be.cedric.lampen/g" addons/lampen/app/build.gradle
          sed -i 's/rootProject.name = "weather"/rootProject.name = "lampen"/' addons/lampen/settings.gradle
          find addons/lampen/app/src -type f
      - name: Lampen-app bouwen
        working-directory: addons/lampen
        run: |
          for i in 1 2 3; do chmod +x gradlew && ./gradlew --no-daemon assembleRelease && break; echo "opnieuw proberen"; sleep 10; done
          test -f app/build/outputs/apk/release/app-release.apk
      - name: APK verzamelen
        run: |
          mkdir out
          cp addons/lampen/app/build/outputs/apk/release/app-release.apk out/lampen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lampen
          path: out/
