name: Bouw alles v7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Vaste handtekening
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          test -n "$KS" || { echo "Het geheim DEBUG_KEYSTORE ontbreekt"; exit 1; }
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore ~/tv.keystore
      - name: Aanpassingen uitpakken
        run: |
          grep -o 'echo "[A-Za-z0-9+/=]\{200,\}"' .github/workflows/bouw-v2.yml | sed 's/^echo "//;s/"$//' | base64 -d | tar xJ -C /tmp
          grep -o 'echo "[A-Za-z0-9+/=]\{200,\}"' .github/workflows/bouw-v3.yml | sed 's/^echo "//;s/"$//' | base64 -d | xz -d | patch -d /tmp/extra -p1
          rm -rf /tmp/extra/lampen/app/src/film /tmp/extra/lampen/app/src/uit /tmp/extra/lampen/app/src/main/java/be/cedric/lampen/QuickActivity.java
          grep -o 'echo "[A-Za-z0-9+/=]\{200,\}"' .github/workflows/bouw-v4.yml | sed 's/^echo "//;s/"$//' | base64 -d | tar xJ -C /tmp
          grep -o 'echo "[A-Za-z0-9+/=]\{200,\}"' .github/workflows/bouw-v5.yml | sed 's/^echo "//;s/"$//' | base64 -d | xz -d | patch -d /tmp/extra -p1
          grep -o 'echo "[A-Za-z0-9+/=]\{200,\}"' .github/workflows/bouw-v6.yml | sed 's/^echo "//;s/"$//' | base64 -d | xz -d | patch -d /tmp/extra -p1
          echo "" | base64 -d | xz -d | patch -d /tmp/extra -p1
          python3 /tmp/extra/patch_video.py launcher/app/src/main/java/com/gathin/tvhome
          python3 /tmp/extra/patch_extra.py launcher/app/src/main /tmp/extra/WeatherPill.java
          cp -r addons/weather addons/lampen
          rm -rf addons/lampen/app addons/lampen/README.md
          cp -r /tmp/extra/lampen/app addons/lampen/app
          sed -i 's/rootProject.name = "weather"/rootProject.name = "lampen"/' addons/lampen/settings.gradle
          git clone -q https://github.com/nayuki/QR-Code-generator /tmp/qr
          git -C /tmp/qr checkout -q bcfe1b018cec5f1f91b5705eca5bb4cdd34e9f8d
          mkdir -p addons/lampen/app/src/main/java/io/nayuki/qrcodegen
          cp /tmp/qr/java/src/main/java/io/nayuki/qrcodegen/{QrCode,QrSegment,BitBuffer,DataTooLongException}.java addons/lampen/app/src/main/java/io/nayuki/qrcodegen/
          for f in launcher/app/build.gradle addons/lampen/app/build.gradle; do printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv("HOME") + "/tv.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> $f; done
      - name: Launcher bouwen
        working-directory: launcher
        run: |
          for i in 1 2 3; do chmod +x gradlew && ./gradlew --no-daemon assembleRelease && break; echo "opnieuw proberen"; sleep 15; done
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Lampen-apps bouwen
        working-directory: addons/lampen
        run: |
          for i in 1 2 3; do chmod +x gradlew && ./gradlew --no-daemon assembleRelease && break; echo "opnieuw proberen"; sleep 15; done
          find app/build/outputs/apk -name "*.apk"
      - name: APK's verzamelen
        run: |
          mkdir out
          cp launcher/app/build/outputs/apk/release/app-release.apk out/launcher.apk
          for f in lampen wifi; do cp addons/lampen/app/build/outputs/apk/$f/release/app-$f-release.apk out/$f.apk; done
          ls -la out
      - name: Handtekening controleren
        run: |
          for f in out/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$f" | grep -i "SHA-256 digest" | grep -q 8744d7d5287901555d33f25c4670353319a6afca14df52fd57ad5cb0dc3ad3b9 || { echo "$f heeft niet de vaste handtekening"; exit 1; }
            echo "$f: vaste handtekening OK"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: alles-v7
          path: out/
